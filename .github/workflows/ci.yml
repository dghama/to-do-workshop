name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-environment:
    name: Resolve and validate branch CI environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Select a sample environment for the target branch
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            target_branch="$BASE_REF"
          else
            target_branch="$REF_NAME"
          fi

          case "$target_branch" in
            develop)
              ci_environment=staging
              source_file=.env.staging.example
              target_file=.env.staging
              ;;
            main)
              ci_environment=prod
              source_file=.env.production.example
              target_file=.env.production
              ;;
            *)
              ci_environment=test
              source_file=.env.test.example
              target_file=.env.test
              ;;
          esac

          cp "$source_file" "$target_file"
          echo "environment=$ci_environment" >> "$GITHUB_OUTPUT"
          echo "Resolved CI environment: $ci_environment"
      - name: Validate selected Compose environment
        env:
          CI_ENVIRONMENT: ${{ steps.resolve.outputs.environment }}
        run: corepack pnpm run env -- "$CI_ENVIRONMENT" config

  environment-config:
    name: Validate GitHub Environment configuration
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Validate environment-scoped CI settings
        shell: bash
        env:
          CI_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
          CI_LOG_LEVEL: ${{ vars.CI_LOG_LEVEL || 'info' }}
          CI_WEB_ORIGIN: ${{ vars.CI_WEB_ORIGIN || 'http://localhost:5175' }}
          CI_API_BASE_URL: ${{ vars.CI_API_BASE_URL || 'http://localhost:3001/api/v1' }}
        run: |
          case "$CI_LOG_LEVEL" in
            fatal|error|warn|info|debug|trace|silent) ;;
            *) echo "::error::Invalid CI_LOG_LEVEL"; exit 1 ;;
          esac
          for name in CI_WEB_ORIGIN CI_API_BASE_URL; do
            value="${!name}"
            if [[ ! "$value" =~ ^http://(localhost|127\.0\.0\.1)(:[0-9]{1,5})?(/[^[:space:]]*)?$ ]]; then
              echo "::error::$name must be a local HTTP URL for isolated CI validation"
              exit 1
            fi
          done
          LOG_LEVEL="$CI_LOG_LEVEL" WEB_ORIGIN="$CI_WEB_ORIGIN" VITE_API_BASE_URL="$CI_API_BASE_URL" \
            corepack pnpm run env -- "$CI_ENVIRONMENT" config

  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    needs: resolve-environment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: corepack pnpm lint
      - run: corepack pnpm format:check
      - run: corepack pnpm typecheck

  unit:
    name: Unit and API integration tests
    runs-on: ubuntu-latest
    needs: resolve-environment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: corepack pnpm test

  migration:
    name: Apply migrations to isolated PostgreSQL
    runs-on: ubuntu-latest
    needs: resolve-environment
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: todo_ci
          POSTGRES_USER: todo_ci
          POSTGRES_PASSWORD: todo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo_ci -d todo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://todo_ci:todo_ci@127.0.0.1:5432/todo_ci?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Apply committed Prisma migrations
        run: corepack pnpm db:migrate

  semgrep:
    name: Semgrep static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned Semgrep CLI
        run: python -m pip install --disable-pip-version-check semgrep==1.186.0
      - name: Scan source with Semgrep
        run: semgrep scan --config p/default --error --metrics=off

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository history and working tree
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  e2e:
    name: Playwright browser and API tests
    runs-on: ubuntu-latest
    needs: resolve-environment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Chromium and system dependencies
        run: corepack pnpm --filter @todo/e2e exec playwright install --with-deps chromium
      - name: Run browser and API smoke tests
        run: corepack pnpm test:e2e:all
      - name: Generate Allure HTML report
        if: always()
        shell: bash
        run: |
          if find tests/e2e/allure-results -type f -name '*-result.json' -print -quit | grep -q .; then
            corepack pnpm allure:report
          else
            echo "::warning::No Allure results were generated."
          fi
      - name: Upload downloadable Allure report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-report
          path: tests/e2e/allure-report/
          if-no-files-found: warn
          retention-days: 14
