name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-environment:
    name: Resolve and validate branch CI environment
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: todo_ci
      POSTGRES_USER: todo_ci
      POSTGRES_PASSWORD: todo_ci
      DATABASE_URL_DOCKER: postgresql://todo_ci:todo_ci@db:5432/todo_ci
      WEB_ORIGIN: http://localhost:5175
      VITE_API_BASE_URL: http://localhost:3001/api/v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select isolated configuration for the target branch
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            target_branch="$BASE_REF"
          else
            target_branch="$REF_NAME"
          fi

          case "$target_branch" in
            develop)
              node_environment=staging
              ;;
            main)
              node_environment=production
              ;;
            *)
              node_environment=test
              ;;
          esac

          echo "environment=$node_environment" >> "$GITHUB_OUTPUT"
          echo "Resolved CI environment: $node_environment"
      - name: Validate selected Compose environment
        env:
          NODE_ENV: ${{ steps.resolve.outputs.environment }}
        run: docker compose --env-file /dev/null config --quiet

  environment-config:
    name: Validate GitHub Environment configuration
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate environment-scoped CI settings
        shell: bash
        env:
          CI_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
          NODE_ENV: ${{ vars.NODE_ENV }}
          API_PORT: ${{ vars.API_PORT }}
          WEB_PORT: ${{ vars.WEB_PORT }}
          POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ github.ref == 'refs/heads/develop' && secrets.POSTGRES_PASSWORD || '' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
          DATABASE_URL: ${{ github.ref == 'refs/heads/develop' && secrets.DATABASE_URL || '' }}
          DATABASE_URL_DOCKER: ${{ github.ref == 'refs/heads/develop' && secrets.DATABASE_URL_DOCKER || '' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [[ "$CI_ENVIRONMENT" == staging ]]; then
            for name in NODE_ENV API_PORT WEB_PORT POSTGRES_PORT POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD LOG_LEVEL WEB_ORIGIN DATABASE_URL DATABASE_URL_DOCKER VITE_API_BASE_URL; do
              if [[ -z "${!name}" ]]; then
                echo "::error::Missing staging environment setting: $name"
                exit 1
              fi
            done
            if [[ "$NODE_ENV" != staging ]]; then
              echo "::error::The staging NODE_ENV must be staging"
              exit 1
            fi
            node --input-type=module <<'NODE'
          for (const name of ['DATABASE_URL', 'DATABASE_URL_DOCKER']) {
            try {
              const url = new URL(process.env[name]);
              if (!['postgres:', 'postgresql:'].includes(url.protocol)) throw new Error();
            } catch {
              console.error(`::error::${name} must be a PostgreSQL URL`);
              process.exit(1);
            }
          }
          NODE
          else
            export NODE_ENV=production API_PORT=3001 WEB_PORT=5175 POSTGRES_PORT=5435
            export POSTGRES_DB=todo_ci POSTGRES_USER=todo_ci POSTGRES_PASSWORD=todo_ci
            export LOG_LEVEL=info WEB_ORIGIN=http://localhost:5175
            export DATABASE_URL_DOCKER=postgresql://todo_ci:todo_ci@db:5432/todo_ci
            export VITE_API_BASE_URL=http://localhost:3001/api/v1
          fi
          case "$LOG_LEVEL" in
            fatal|error|warn|info|debug|trace|silent) ;;
            *) echo "::error::Invalid LOG_LEVEL"; exit 1 ;;
          esac
          for name in API_PORT WEB_PORT POSTGRES_PORT; do
            if [[ ! "${!name}" =~ ^[0-9]+$ ]] || (( 10#${!name} < 1 || 10#${!name} > 65535 )); then
              echo "::error::Invalid port: $name"
              exit 1
            fi
          done
          docker compose --env-file /dev/null config --quiet

  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    needs: resolve-environment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: corepack pnpm lint
      - run: corepack pnpm format:check
      - run: corepack pnpm typecheck

  unit:
    name: Unit and API integration tests
    runs-on: ubuntu-latest
    needs: resolve-environment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: corepack pnpm test

  migration:
    name: Apply migrations to isolated PostgreSQL
    runs-on: ubuntu-latest
    needs: resolve-environment
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: todo_ci
          POSTGRES_USER: todo_ci
          POSTGRES_PASSWORD: todo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo_ci -d todo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://todo_ci:todo_ci@127.0.0.1:5432/todo_ci?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Apply committed Prisma migrations
        run: corepack pnpm db:migrate

  semgrep:
    name: Semgrep static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned Semgrep CLI
        run: python -m pip install --disable-pip-version-check semgrep==1.186.0
      - name: Scan source with Semgrep
        run: semgrep scan --config p/default --error --metrics=off

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository history and working tree
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  e2e:
    name: Playwright browser and API tests
    runs-on: ubuntu-latest
    needs: resolve-environment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Chromium and system dependencies
        run: corepack pnpm --filter @todo/e2e exec playwright install --with-deps chromium
      - name: Run browser and API smoke tests
        run: corepack pnpm test:e2e:all
      - name: Generate Allure HTML report
        if: always()
        shell: bash
        run: |
          if find tests/e2e/allure-results -type f -name '*-result.json' -print -quit | grep -q .; then
            corepack pnpm allure:report
          else
            echo "::warning::No Allure results were generated."
          fi
      - name: Upload downloadable Allure report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-report
          path: tests/e2e/allure-report/
          if-no-files-found: warn
          retention-days: 14
