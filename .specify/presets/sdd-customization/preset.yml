schema_version: "1.0"

preset:
  id: "sdd-customization"
  name: "SDD Customization"
  version: "1.0.0"
  description: "Add reusable, integration-neutral guidance across the Spec Kit SDD lifecycle"

requires:
  speckit_version: ">=1.0.7"

provides:
  templates:
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Append reusable use-case fields to the feature specification"
      strategy: "append"
    - type: "command"
      name: "speckit.constitution"
      file: "commands/constitution.md"
      description: "Keep Constitution updates focused on durable, evidence-based governance"
      strategy: "prepend"
    - type: "command"
      name: "speckit.specify"
      file: "commands/specify.md"
      description: "Structure specifications around outcomes, use cases, and acceptance criteria"
      strategy: "prepend"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/clarify.md"
      description: "Resolve high-impact ambiguity before planning"
      strategy: "prepend"
    - type: "command"
      name: "speckit.plan"
      file: "commands/consume.md"
      description: "Use the resolved feature specification as the source of product intent"
      strategy: "prepend"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/consume.md"
      description: "Use the resolved feature specification as the source of product intent"
      strategy: "prepend"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/consume.md"
      description: "Use the resolved feature specification as the source of product intent"
      strategy: "prepend"
    - type: "command"
      name: "speckit.implement"
      file: "commands/consume.md"
      description: "Use the resolved feature specification as the source of product intent"
      strategy: "prepend"
    - type: "command"
      name: "speckit.checklist"
      file: "commands/consume.md"
      description: "Use resolved feature artifacts without imposing repository-specific paths"
      strategy: "prepend"
    - type: "command"
      name: "speckit.converge"
      file: "commands/consume.md"
      description: "Use resolved feature artifacts without imposing repository-specific paths"
      strategy: "prepend"

tags:
  - "sdd"
  - "specification"
  - "workflow"
  - "requirements"
