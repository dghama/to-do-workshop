name: todo-workshop-${NODE_ENV:-development}

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the selected environment file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the selected environment file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the selected environment file}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - todo-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -v ON_ERROR_STOP=1 -c "SELECT 1" >/dev/null',
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN in the selected environment file}
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER in the selected environment file}
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL in the selected environment file}
    ports:
      - '${WEB_PORT:-5173}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6

  api-tests:
    profiles: ['test']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    command: ['pnpm', '--filter', '@todo/api', 'test:integration']
    environment:
      NODE_ENV: test
      LOG_LEVEL: silent
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN in the selected environment file}
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER in the selected environment file}
    depends_on:
      db:
        condition: service_healthy

volumes:
  todo-postgres-data:
