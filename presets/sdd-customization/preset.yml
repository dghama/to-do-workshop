schema_version: "1.0"

preset:
  id: "sdd-customization"
  name: "SDD Customization"
  version: "1.1.0"
  description: "Add reusable, integration-neutral guidance across the Spec Kit SDD lifecycle"

requires:
  speckit_version: ">=1.0.7"

provides:
  templates:
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Append reusable use-case fields to the feature specification"
      strategy: "append"
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Record relevant technical impact classifications in the implementation plan"
      strategy: "append"
    - type: "command"
      name: "speckit.constitution"
      file: "commands/constitution.md"
      description: "Keep Constitution updates focused on durable, evidence-based governance"
      strategy: "prepend"
    - type: "command"
      name: "speckit.specify"
      file: "commands/specify.md"
      description: "Structure specifications around outcomes, use cases, and acceptance criteria"
      strategy: "prepend"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/clarify.md"
      description: "Resolve high-impact ambiguity before planning"
      strategy: "prepend"
    - type: "command"
      name: "speckit.plan"
      file: "commands/plan.md"
      description: "Connect relevant technical impact to requirements and repository evidence"
      strategy: "prepend"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/tasks.md"
      description: "Trace implementation and verification tasks to stable requirements"
      strategy: "prepend"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/analyze.md"
      description: "Verify traceability using explicit requirement references"
      strategy: "prepend"
    - type: "command"
      name: "speckit.implement"
      file: "commands/implement.md"
      description: "Keep implementation within approved tasks and report deviations"
      strategy: "prepend"
    - type: "command"
      name: "speckit.checklist"
      file: "commands/feature-context.md"
      description: "Use resolved feature artifacts without imposing repository-specific paths"
      strategy: "prepend"
    - type: "command"
      name: "speckit.converge"
      file: "commands/feature-context.md"
      description: "Use resolved feature artifacts without imposing repository-specific paths"
      strategy: "prepend"

tags:
  - "sdd"
  - "specification"
  - "workflow"
  - "requirements"
