schema_version: "1.0"

preset:
  id: "spec-customization"
  name: "Specification Customization"
  version: "1.0.0"
  description: "Generate customized use-case specifications directly in each feature spec file"

requires:
  speckit_version: ">=1.0.7"

provides:
  templates:
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Use-case specification written directly to the feature spec"
    - type: "command"
      name: "speckit.specify"
      file: "commands/specify.md"
      description: "Create the use-case specification directly in spec.md"
      strategy: "prepend"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/clarify.md"
      description: "Clarify the feature specification in spec.md"
      strategy: "prepend"
    - type: "command"
      name: "speckit.plan"
      file: "commands/consume.md"
      description: "Use the feature specification for planning"
      strategy: "prepend"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/consume.md"
      description: "Use the feature specification for task generation"
      strategy: "prepend"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/consume.md"
      description: "Use the feature specification for analysis"
      strategy: "prepend"
    - type: "command"
      name: "speckit.checklist"
      file: "commands/consume.md"
      description: "Use the feature specification for checklists"
      strategy: "prepend"
    - type: "command"
      name: "speckit.implement"
      file: "commands/consume.md"
      description: "Use the feature specification for implementation"
      strategy: "prepend"
    - type: "command"
      name: "speckit.converge"
      file: "commands/consume.md"
      description: "Use the feature specification for convergence"
      strategy: "prepend"

tags:
  - "spec-customization"
  - "specification"
